services:
  partynode-host:
    image: ghcr.io/reckertiii/partynode-node:latest
    container_name: partynode-host
    restart: unless-stopped
    ports:
      - "8080:8080" # Open http://<server-ip>:8080 in your browser to configure & pair!
    volumes:
      - partynode_node_data:/app/data

volumes:
  partynode_node_data:
